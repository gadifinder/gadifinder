<main>


<section class="page-hero">

    <div class="container">

        <h1>
            Compare Cars
        </h1>

        <p>
            Select up to four vehicles and compare
            their important specifications.
        </p>

    </div>

</section>



<section class="section">

    <div class="container">


        <div class="panel">


            <form id="compareForm">


                <div
                    id="compareSelects"
                    class="filter-grid"
                >


                    <div class="field">

                        <label>
                            Car 1
                        </label>

                        <select>
                            <option>
                                Select a car
                            </option>
                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Car 2
                        </label>

                        <select>
                            <option>
                                Select a car
                            </option>
                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Car 3
                        </label>

                        <select>
                            <option>
                                Select a car
                            </option>
                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Car 4
                        </label>

                        <select>
                            <option>
                                Select a car
                            </option>
                        </select>

                    </div>


                </div>



                <div class="filter-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Compare Cars
                    </button>


                    <button
                        type="button"
                        id="resetCompare"
                        class="btn btn-outline"
                    >
                        Reset
                    </button>

                </div>


                <p
                    id="compareMessage"
                    class="muted"
                ></p>


            </form>


        </div>



        <div
            id="compareTableWrap"
            style="
                margin-top:25px;
                overflow:auto;
            "
        >
        </div>


    </div>

</section>
