    .all-cars-hero h1 {

      border: 1px solid rgba(255,255,255,0.09);

      color: #8490a3;

       --------------------------------------------------------- */

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;

    /* ---------------------------------------------------------
       CAR CARD
       --------------------------------------------------------- */

    .all-car-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 12px 35px rgba(0,0,0,0.16);

        box-shadow 0.25s ease;
      cursor: pointer;
    }

    .all-car-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.22);
    }

    .car-image-area {
      height: 220px;
      background:
        linear-gradient(
          145deg,
          #edf1f6,
          #dfe5ed
        );
      position: relative;
      overflow: hidden;
    }

    .car-image-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.3s ease;
    }

    .all-car-card:hover .car-image-area img {
      transform: scale(1.04);
    }

    /*
      IMAGE PLACEHOLDER

      If you have not uploaded the image yet,
      this placeholder remains visible.

      Later put your image path in the database.
    */

    .image-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;

  <!-- ========================================================
       ALL CARS PAGE JAVASCRIPT

       This script controls ONLY this page.
       ======================================================== -->

  <script>

    document.addEventListener("DOMContentLoaded", function () {

      /*
        --------------------------------------------------------
        GET DATABASE
        --------------------------------------------------------

        The database should expose an array named:

        GADI_CARS

        Example:

        const GADI_CARS = [
          {
            id: "maruti-swift",
            brand: "Maruti Suzuki",
            name: "Swift",
            type: "Hatchback",
            startingPrice: "₹6.49 Lakh"
          }
        ];
      */

      const cars =
        Array.isArray(window.GADI_CARS)
          ? window.GADI_CARS
          : [];


      const container =
        document.getElementById("brandsContainer");

      const searchInput =
        document.getElementById("carSearch");

      const noResults =
        document.getElementById("noResults");

      const brandCount =
        document.getElementById("brandCount");


      /*
        --------------------------------------------------------
        REQUIRED BRANDS

        These are the brands you previously selected
        for the All Cars section.
        --------------------------------------------------------
      */

      const allowedBrands = [
        "Maruti Suzuki",
        "Toyota",
        "Hyundai",
        "Kia",
        "Tata",
        "Mahindra",
        "Honda",
        "MG",
        "Skoda",
        "Volkswagen",
        "Renault",
        "Nissan",
        "Citroen",
        "BYD",
        "Force",
        "Jeep"
      ];


      /*
        --------------------------------------------------------
        NORMALIZE TEXT
        --------------------------------------------------------
      */

      function normalize(value) {

        return String(value || "")
          .trim()
          .toLowerCase();

      }


      /*
        --------------------------------------------------------
        CHECK BRAND
        --------------------------------------------------------
      */

      function isAllowedBrand(brand) {

        const current =
          normalize(brand);

        return allowedBrands.some(function (allowed) {

          return normalize(allowed) === current;

        });

      }


      /*
        --------------------------------------------------------
        FILTER DATABASE
        --------------------------------------------------------
      */

      const filteredCars =
        cars.filter(function (car) {

          return isAllowedBrand(car.brand);

        });


      /*
        --------------------------------------------------------
        GROUP BY BRAND
        --------------------------------------------------------
      */

      function groupCarsByBrand(list) {

        const groups = {};

        list.forEach(function (car) {

          const brand =
            car.brand || "Other";

          if (!groups[brand]) {
            groups[brand] = [];
          }

          groups[brand].push(car);

        });

        return groups;

      }


      /*
        --------------------------------------------------------
        CREATE CAR CARD
        --------------------------------------------------------
      */

      function createCarCard(car) {

        const card =
          document.createElement("article");

        card.className = "all-car-card";

        /*
          Every card opens the individual car page.

          The ID is sent through the URL.

          Example:

          09-car-details.html?id=maruti-swift
        */

        card.addEventListener("click", function () {

          if (!car.id) {
            return;
          }

          window.location.href =
            "09-car-details.html?id=" +
            encodeURIComponent(car.id);

        });


        const imageArea =
          document.createElement("div");

        imageArea.className =
          "car-image-area";


        /*
          IMAGE SUPPORT

          Database can contain:

          image

          or

          images: [
            "image1.avif",
            "image2.avif"
          ]

          The first image will be used on this card.
        */

        const imagePath =
          car.image ||
          (
            Array.isArray(car.images)
              ? car.images[0]
              : ""
          );


        if (imagePath) {

          const img =
            document.createElement("img");

          img.src = imagePath;

          img.alt =
            (car.brand || "") +
            " " +
            (car.name || "Car");

          img.loading = "lazy";

          img.onerror =
            function () {

              img.remove();

              showPlaceholder(
                imageArea,
                car
              );

            };

          imageArea.appendChild(img);

        } else {

          showPlaceholder(
            imageArea,
            car
          );

        }


        const content =
          document.createElement("div");

        content.className =
          "all-car-content";


        const name =
          document.createElement("h3");

        name.className =
          "all-car-name";

        name.textContent =
          car.name || "Car";

        content.appendChild(name);


        const type =
          document.createElement("div");

        type.className =
          "all-car-type";

        type.textContent =
          car.type ||
          "Passenger vehicle";

        content.appendChild(type);


        const bottom =
          document.createElement("div");

        bottom.className =
          "all-car-bottom";


        const price =
          document.createElement("div");

        price.className =
          "all-car-price";

        price.innerHTML =
          escapeHTML(
            car.startingPrice ||
            car.price ||
            "Price available"
          ) +
          "<small>Starting ex-showroom price</small>";


        bottom.appendChild(price);


        const button =
          document.createElement("button");

        button.className =
          "view-car-btn";

        button.type =
          "button";

        button.textContent =
          "View Car →";


        button.addEventListener(
          "click",
          function (event) {

            event.stopPropagation();

            if (!car.id) {
              return;
            }

            window.location.href =
              "09-car-details.html?id=" +
              encodeURIComponent(car.id);

          }
        );


        bottom.appendChild(button);

        content.appendChild(bottom);

        card.appendChild(imageArea);

        card.appendChild(content);

        return card;

      }


      /*
        --------------------------------------------------------
        PLACEHOLDER
        --------------------------------------------------------
      */

      function showPlaceholder(
        parent,
        car
      ) {

        const placeholder =
          document.createElement("div");

        placeholder.className =
          "image-placeholder";

        placeholder.innerHTML =

          '<div class="image-placeholder-icon">🚗</div>' +

          '<strong>' +
          escapeHTML(
            (car.brand || "") +
            " " +
            (car.name || "Car")
          ) +
          '</strong>' +

          '<small>Car image will be added here</small>';

        parent.appendChild(
          placeholder
        );

      }


      /*
        --------------------------------------------------------
        ESCAPE HTML
        --------------------------------------------------------
      */

      function escapeHTML(value) {

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      }


      /*
        --------------------------------------------------------
        RENDER BRANDS
        --------------------------------------------------------
      */

      function renderCars(searchTerm) {

        container.innerHTML = "";

        const query =
          normalize(searchTerm);


        const matchingCars =
          filteredCars.filter(function (car) {

            if (!query) {
              return true;
            }

            const searchable =
              normalize(
                (car.brand || "") +
                " " +
                (car.name || "") +
                " " +
                (car.type || "")
              );

            return searchable.includes(
              query
            );

          });


        const groups =
          groupCarsByBrand(
            matchingCars
          );


        let visibleBrandCount = 0;


        /*
          Maintain the preferred brand order.
        */

        allowedBrands.forEach(
          function (brandName) {

            const matchingBrandKey =
              Object.keys(groups).find(
                function (key) {

                  return normalize(key) ===
                    normalize(brandName);

                }
              );


            if (!matchingBrandKey) {
              return;
            }


            const brandCars =
              groups[matchingBrandKey];


            visibleBrandCount++;


            /*
              BRAND SECTION
            */

            const section =
              document.createElement("section");

            section.className =
              "brand-section";


            /*
              BRAND HEADING
            */

            const heading =
              document.createElement("div");

            heading.className =
              "brand-heading";


            const titleWrap =
              document.createElement("div");

            titleWrap.className =
              "brand-title-wrap";


            const logo =
              document.createElement("div");

            logo.className =
              "brand-logo-placeholder";

            /*
              We intentionally use initials/text here
              until you provide the actual brand logos.
            */

            logo.textContent =
              getBrandInitials(
                matchingBrandKey
              );


            const textWrap =
              document.createElement("div");


            const title =
              document.createElement("h2");

            title.className =
              "brand-title";

            title.textContent =
              matchingBrandKey;


            const count =
              document.createElement("div");

            count.className =
              "brand-model-count";

            count.textContent =
              brandCars.length +
              (
                brandCars.length === 1
                  ? " model"
                  : " models"
              );


            textWrap.appendChild(
              title
            );

            textWrap.appendChild(
              count
            );


            titleWrap.appendChild(
              logo
            );

            titleWrap.appendChild(
              textWrap
            );


            heading.appendChild(
              titleWrap
            );


            section.appendChild(
              heading
            );


            /*
              CAR GRID
            */

            const grid =
              document.createElement("div");

            grid.className =
              "cars-grid";


            brandCars.forEach(
              function (car) {

                grid.appendChild(
                  createCarCard(car)
                );

              }
            );


            section.appendChild(
              grid
            );


            container.appendChild(
              section
            );

          }
        );


        /*
          SEARCH RESULT STATE
        */

        if (
          matchingCars.length === 0
        ) {

          noResults.style.display =
            "block";

        } else {

          noResults.style.display =
            "none";

        }


        brandCount.textContent =
          visibleBrandCount +
          (
            visibleBrandCount === 1
              ? " Brand"
              : " Brands"
          );

      }


      /*
        --------------------------------------------------------
        BRAND INITIALS
        --------------------------------------------------------
      */

      function getBrandInitials(
        brand
      ) {

        const words =
          String(brand)
            .trim()
            .split(/\s+/)
            .filter(Boolean);


        if (words.length === 1) {

          return words[0]
            .substring(0, 2)
            .toUpperCase();

        }


        return (
          words[0][0] +
          words[1][0]
        ).toUpperCase();

      }


      /*
        --------------------------------------------------------
        LIVE SEARCH
        --------------------------------------------------------
      */

      searchInput.addEventListener(
        "input",
        function () {

          renderCars(
            searchInput.value
          );

        }
      );


      /*
        --------------------------------------------------------
        INITIAL RENDER
        --------------------------------------------------------
      */

      renderCars("");

    });

  </script>
