<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maruti Swift | Gadi Finder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172238;
      padding: 40px 20px;
    }

    .car-card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    .car-image {
      width: 100%;
      height: 260px;
      background: #eef2f7;
      overflow: hidden;
    }

    .car-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .car-info {
      padding: 22px;
    }

    .car-brand {
      font-size: 13px;
      font-weight: 700;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .car-name {
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .car-price {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .car-details {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .detail {
      background: #f1f4f8;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .view-button {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #06101f;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .view-button:hover {
      background: #102442;
    }
  </style>

</head>

<body>

  <div class="car-card">

```
<!-- MAIN CAR IMAGE -->
<div class="car-image">
  <img
    src="images/cars/maruti-swift/swift-exterior-right-front-three-quarter-31.avif"

  >
</div>

<!-- CAR INFORMATION -->

  <div class="car-brand">

  </div>

  <div class="car-name">

  </div>

  <div class="car-price">
    ₹6.49 Lakh onwards
  </div>

  <div class="car-details">
    <span class="detail">Petrol</span>
    <span class="detail">Manual</span>
    <span class="detail">5 Seater</span>
  </div>

  <button class="view-button">
    View Car →
  </button>

</div>

</body>
</html>
